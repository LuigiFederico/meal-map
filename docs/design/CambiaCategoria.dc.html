<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Cambia categoria</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&amp;display=swap">
<style>
body{margin:0;background:#F8F9FF}
a{color:#2F5B8A}a:hover{color:#1B3F66}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F8F9FF; color: #191C20; font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="flex: none; display: flex; align-items: center; gap: 4px; height: 64px; padding: 0 12px 0 4px; border-bottom: 1px solid #E1E2E8">
    <a href="Dettaglio.dc.html" aria-label="Chiudi senza salvare" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #191C20"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.close}}"></path></svg></a>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 13px; color: #43474E">Cambia categoria</div>
      <h1 style="margin: 0; font-size: 20px; font-weight: 500">Sabato · Pranzo</h1>
    </div>
    <a href="Settimana.dc.html" style="display: inline-flex; align-items: center; height: 40px; padding: 0 20px; border-radius: 20px; background: #2F5B8A; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600">Salva</a>
  </header>

  <main style="flex: 1; min-height: 0; overflow: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #43474E">Ora: <span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 6px; border-radius: 8px; background: #D0EBC6; color: #23461F; font-weight: 500"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.legumi}}"></path></svg>Legumi</span> · pasta</div>

    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0 0 8px; font-size: 16px; font-weight: 600">Fonte proteica</legend>
      <div style="border-radius: 20px; background: #F0F3FA; padding: 4px 0">
        <sc-for list="{{prots}}" as="p" hint-placeholder-count="7">
          <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 4px 14px; cursor: pointer">
            <input type="radio" name="prot" checked="{{p.on}}" onChange="{{p.pick}}" style="width: 20px; height: 20px; margin: 0; accent-color: #2F5B8A">
            <span style="flex: none; width: 34px; height: 34px; border-radius: 10px; background: {{p.bg}}; color: {{p.fg}}; display: flex; align-items: center; justify-content: center"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{p.icon}}"></path></svg></span>
            <span style="flex: 1; font-size: 15px; font-weight: 500">{{p.label}}</span>
            <span style="font-size: 13px; font-variant-numeric: tabular-nums; color: {{p.color}}; font-weight: {{p.weight}}">{{p.proj}}</span>
          </label>
        </sc-for>
      </div>
    </fieldset>

    <sc-if value="{{over}}" hint-placeholder-val="{{ true }}">
      <div role="status" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: #FFDAD6; color: #410002; font-size: 14px; line-height: 20px"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.warn}}"></path></svg><span>{{overText}}</span></div>
    </sc-if>

    <sc-if value="{{food}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 16px; font-weight: 600">Cereale</div>
        <div role="group" aria-label="Cereale" style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{cers}}" as="c" hint-placeholder-count="10">
            <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 16px; font-weight: 600">Oppure senza categoria</div>
      <div role="group" aria-label="Senza categoria" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{nones}}" as="n" hint-placeholder-count="3">
          <button onClick="{{n.pick}}" aria-pressed="{{n.on}}" style="{{n.style}}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.icon}}"></path></svg>{{n.label}}</button>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const IC = {
  legumi: 'M4.5 15.5C7 9 12 5 19.5 4.5 19 12 14.5 17.5 8.5 19.5c-2.5.8-4.8-1.5-4-4z M8 15a1.4 1.4 0 1 0 2.8 0 1.4 1.4 0 1 0-2.8 0 M11.5 11.5a1.4 1.4 0 1 0 2.8 0 1.4 1.4 0 1 0-2.8 0 M15 8a1.4 1.4 0 1 0 2.8 0 1.4 1.4 0 1 0-2.8 0',
  pesce: 'M6 12c2.5-3.3 5.4-5 8.5-5 3 0 5.2 2 6.5 5-1.3 3-3.5 5-6.5 5-3.1 0-6-1.7-8.5-5z M6 12 2.5 8.5v7z M16.5 10.8v.01',
  bianca: 'M14.5 3.5c3.3 0 6 2.7 6 6 0 3.6-3.4 5.5-6.6 5.5l-3.6 3.6a2 2 0 1 1-2.6 2.3 2 2 0 1 1-2.3-2.6l3.6-3.6c0-3.2 1.9-11.2 5.5-11.2z',
  rossa: 'M4.5 10c0-3.6 3.4-6 7.8-6 4.6 0 7.7 2.6 7.7 6.5 0 5-3.4 9.5-9 9.5-3.7 0-6.5-2-6.5-4.7 0-1.8 1.4-2.4 1.4-3.4S4.5 11.2 4.5 10z M13.5 10.5a1.6 1.6 0 1 0 3.2 0 1.6 1.6 0 1 0-3.2 0',
  uova: 'M12 3c3.6 0 6.5 5.6 6.5 10a6.5 6.5 0 0 1-13 0C5.5 8.6 8.4 3 12 3z',
  formaggi: 'M3 18v-6.5L15 5l6 6.5V18z M3 11.5h18 M8 15v.01 M15.5 14.5v.01',
  affettati: 'M3 12a9 9 0 1 0 18 0 9 9 0 1 0-18 0 M8 12a4 4 0 1 0 8 0 4 4 0 1 0-8 0',
  mensa: 'M3 20h18 M5 20V9l7-4.5L19 9v11 M9.5 20v-5h5v5',
  fuori: 'M7 3v18 M4.5 3v5a2.5 2.5 0 0 0 5 0V3 M17.5 21V3c-2.2 0-3.5 3-3.5 7h3.5',
  libero: 'M4.5 4.5h15v15h-15z M9 9v.01 M15 15v.01 M12 12v.01 M15 9v.01 M9 15v.01',
  close: 'M6 6l12 12 M18 6 6 18',
  warn: 'M12 4 2.5 20h19z M12 10v4.5 M12 17.2v.01'
};
// Conteggi della settimana escluso questo pasto (sabato pranzo).
const PROTS = [
  { k: 'legumi', label: 'Legumi', bg: '#D0EBC6', fg: '#23461F', min: 3, max: null, base: 3 },
  { k: 'pesce', label: 'Pesce', bg: '#C9E6F5', fg: '#0E4A61', min: 2, max: null, base: 2 },
  { k: 'uova', label: 'Uova', bg: '#F3E5AE', fg: '#574500', min: 2, max: 2, base: 2 },
  { k: 'bianca', label: 'Carne bianca', bg: '#FADCC8', fg: '#6B3A1A', min: 1, max: 2, base: 1 },
  { k: 'rossa', label: 'Carne rossa', bg: '#F9D7DC', fg: '#842235', min: null, max: 1, base: 1 },
  { k: 'affettati', label: 'Affettati', bg: '#E5DBF5', fg: '#4E3478', min: null, max: 2, base: 1 },
  { k: 'formaggi', label: 'Formaggi', bg: '#E9DFD2', fg: '#54452F', min: null, max: 2, base: 1 }
];
const CERS = ['Pane', 'Pasta', 'Riso', 'Patate', 'Piadina', 'Farro', 'Orzo', 'Polenta', 'Gnocchi', 'Focaccia'];
const NONES = [['mensa', 'Mensa'], ['fuori', 'Fuori casa'], ['libero', 'A scelta']];
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sel = st.sel || 'rossa';
    const cer = st.cer || 'Pasta';
    const isNone = NONES.some(([k]) => k === sel);
    const prots = PROTS.map((p) => {
      const n = p.base + 1;
      const over = p.max != null && n > p.max;
      const lim = p.max != null ? 'max ' + p.max : 'min ' + p.min;
      return {
        label: p.label, bg: p.bg, fg: p.fg, icon: IC[p.k],
        on: p.k === sel,
        pick: () => this.setState({ sel: p.k }),
        proj: (p.k === 'legumi' ? 'attuale · ' : 'diventa ') + n + ' · ' + lim,
        color: over ? '#BA1A1A' : '#43474E',
        weight: over ? 600 : 400,
        over
      };
    });
    const chosen = prots.find((p) => p.on);
    const chosenRaw = PROTS.find((p) => p.k === sel);
    const chip = (on) => 'display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500; ' + (on ? 'background: #D7E3F8; color: #101C2B; border: 1px solid #D7E3F8' : 'background: transparent; color: #43474E; border: 1px solid #73777F');
    return {
      ic: IC,
      prots,
      food: !isNone,
      over: !!(chosen && chosen.over),
      overText: chosenRaw ? chosenRaw.label + ' arriverebbe a ' + (chosenRaw.base + 1) + ' su un massimo di ' + chosenRaw.max + '. Puoi salvare comunque: lo vedrai segnalato nel Bilancio.' : '',
      cers: CERS.map((c) => ({ label: c, on: c === cer, pick: () => this.setState({ cer: c }), style: chip(c === cer) })),
      nones: NONES.map(([k, label]) => ({ label, icon: IC[k], on: k === sel, pick: () => this.setState({ sel: k }), style: chip(k === sel) }))
    };
  }
}
</script>
</body>
</html>
