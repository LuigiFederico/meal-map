<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Trascina per scambiare</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&amp;display=swap">
<style>
body{margin:0;background:#F8F9FF}
a{color:#2F5B8A}a:hover{color:#1B3F66}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F8F9FF; color: #191C20; font-family: 'Roboto Flex', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="flex: none; display: flex; align-items: center; gap: 8px; height: 72px; padding: 0 12px 0 8px; background: #0F2A47; color: #FFFFFF">
    <a href="Settimana.dc.html" aria-label="Annulla trascinamento" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.close}}"></path></svg></a>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 13px; color: #C9DBEE">{{barKicker}}</div>
      <div style="font-size: 18px; font-weight: 500">{{barTitle}}</div>
    </div>
    <svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="color: #A9C5E2"><path d="{{ic.swap}}"></path></svg>
  </header>

  <main style="flex: 1; min-height: 0; overflow: auto; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px">
    <div role="grid" aria-label="Griglia della settimana" style="display: flex; flex-direction: column; gap: 6px">
      <div role="row" style="display: grid; grid-template-columns: 44px repeat(2, minmax(0, 1fr)); gap: 6px; align-items: center">
        <span></span>
        <span role="columnheader" style="padding-left: 4px; font-size: 12px; font-weight: 600; color: #43474E; letter-spacing: 0.4px">PRANZO</span>
        <span role="columnheader" style="padding-left: 4px; font-size: 12px; font-weight: 600; color: #43474E; letter-spacing: 0.4px">CENA</span>
      </div>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div role="row" style="display: grid; grid-template-columns: 44px repeat(2, minmax(0, 1fr)); gap: 6px; align-items: stretch">
          <span role="rowheader" style="box-sizing: border-box; border-radius: 12px; border: 1.5px dashed #A9C5E2; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #2F5B8A">{{d.k}}</span>
          <sc-for list="{{d.tiles}}" as="t" hint-placeholder-count="2">
            <button onClick="{{t.drop}}" aria-label="{{t.aria}}" style="{{t.style}}">
              <sc-if value="{{t.food}}" hint-placeholder-val="{{ true }}">
                <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 16px; font-weight: 600; white-space: nowrap"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.icon}}"></path></svg>{{t.prot}}</span>
                <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; white-space: nowrap"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.cereale}}"></path></svg>{{t.cer}}</span>
                <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; white-space: nowrap"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.verdure}}"></path></svg>Verdure</span>
              </sc-if>
              <sc-if value="{{t.none}}" hint-placeholder-val="{{ false }}">
                <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 16px; font-weight: 600"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.icon}}"></path></svg>{{t.prot}}</span>
              </sc-if>
              <sc-if value="{{t.floating}}" hint-placeholder-val="{{ false }}">
                <span style="position: absolute; left: 14px; top: -24px; width: 100%; height: 66px; box-sizing: border-box; padding: 7px 10px; border-radius: 12px; background: {{dragBg}}; color: {{dragFg}}; display: flex; flex-direction: column; justify-content: center; gap: 2px; text-align: left; transform: rotate(-5deg) scale(1.06); box-shadow: 0 10px 22px rgba(15, 42, 71, 0.35); z-index: 2; pointer-events: none">
                  <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 16px; font-weight: 600"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{dragIcon}}"></path></svg>Carne rossa</span>
                  <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.cereale}}"></path></svg>Pasta</span>
                  <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.verdure}}"></path></svg>Verdure</span>
                </span>
              </sc-if>
            </button>
          </sc-for>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{dragging}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 18px; background: #F0F3FA">
        <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 20px"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="color: #2F5B8A"><path d="{{ic.swap}}"></path></svg><span>Rilascia su un altro pasto per scambiarli. Tocca la casella evidenziata per provare.</span></div>
        <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 20px"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="color: #2F5B8A"><path d="{{ic.cal}}"></path></svg><span>Rilascia sul nome di un giorno per scambiare la giornata intera.</span></div>
        <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 20px; color: #43474E"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.bilancio}}"></path></svg><span>Gli scambi non cambiano il bilancio della settimana.</span></div>
      </div>
    </sc-if>
  </main>

  <sc-if value="{{dropped}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 8px 4px 16px; border-radius: 6px; background: #2E3135; color: #EFF0F7; font-size: 14px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25)">
      <span style="flex: 1">Sabato pranzo e giovedì cena scambiati</span>
      <button onClick="{{undo}}" style="height: 40px; padding: 0 12px; border: none; border-radius: 20px; background: transparent; color: #A4C9FF; font-size: 14px; font-weight: 600; cursor: pointer">Annulla</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const IC = {
  legumi: 'M4.5 15.5C7 9 12 5 19.5 4.5 19 12 14.5 17.5 8.5 19.5c-2.5.8-4.8-1.5-4-4z M8 15a1.4 1.4 0 1 0 2.8 0 1.4 1.4 0 1 0-2.8 0 M11.5 11.5a1.4 1.4 0 1 0 2.8 0 1.4 1.4 0 1 0-2.8 0 M15 8a1.4 1.4 0 1 0 2.8 0 1.4 1.4 0 1 0-2.8 0',
  pesce: 'M6 12c2.5-3.3 5.4-5 8.5-5 3 0 5.2 2 6.5 5-1.3 3-3.5 5-6.5 5-3.1 0-6-1.7-8.5-5z M6 12 2.5 8.5v7z M16.5 10.8v.01',
  bianca: 'M14.5 3.5c3.3 0 6 2.7 6 6 0 3.6-3.4 5.5-6.6 5.5l-3.6 3.6a2 2 0 1 1-2.6 2.3 2 2 0 1 1-2.3-2.6l3.6-3.6c0-3.2 1.9-11.2 5.5-11.2z',
  rossa: 'M4.5 10c0-3.6 3.4-6 7.8-6 4.6 0 7.7 2.6 7.7 6.5 0 5-3.4 9.5-9 9.5-3.7 0-6.5-2-6.5-4.7 0-1.8 1.4-2.4 1.4-3.4S4.5 11.2 4.5 10z M13.5 10.5a1.6 1.6 0 1 0 3.2 0 1.6 1.6 0 1 0-3.2 0',
  uova: 'M12 3c3.6 0 6.5 5.6 6.5 10a6.5 6.5 0 0 1-13 0C5.5 8.6 8.4 3 12 3z',
  formaggi: 'M3 18v-6.5L15 5l6 6.5V18z M3 11.5h18 M8 15v.01 M15.5 14.5v.01',
  affettati: 'M3 12a9 9 0 1 0 18 0 9 9 0 1 0-18 0 M8 12a4 4 0 1 0 8 0 4 4 0 1 0-8 0',
  mensa: 'M3 20h18 M5 20V9l7-4.5L19 9v11 M9.5 20v-5h5v5',
  libero: 'M4.5 4.5h15v15h-15z M9 9v.01 M15 15v.01 M12 12v.01 M15 9v.01 M9 15v.01',
  swap: 'M7 4 3 8l4 4 M3 8h14 M17 20l4-4-4-4 M21 16H7',
  close: 'M6 6l12 12 M18 6 6 18',
  cal: 'M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4',
  bilancio: 'M3 20h18 M6 20v-8 M12 20V5 M18 20v-5',
  cereale: 'M12 21V5 M12 17c-2.6 0-4.3-1.6-4.8-4.2 2.6 0 4.3 1.6 4.8 4.2z M12 17c2.6 0 4.3-1.6 4.8-4.2-2.6 0-4.3 1.6-4.8 4.2z M12 11.5c-2.6 0-4.3-1.6-4.8-4.2 2.6 0 4.3 1.6 4.8 4.2z M12 11.5c2.6 0 4.3-1.6 4.8-4.2-2.6 0-4.3 1.6-4.8 4.2z',
  verdure: 'M5 19c0-8.3 5.2-14 14-14 0 8.8-5.7 14-14 14z M5 19l8.5-8.5'
};
const CAT = {
  legumi: { label: 'Legumi', bg: '#D0EBC6', fg: '#23461F' },
  pesce: { label: 'Pesce', bg: '#C9E6F5', fg: '#0E4A61' },
  bianca: { label: 'Carne bianca', bg: '#FADCC8', fg: '#6B3A1A' },
  rossa: { label: 'Carne rossa', bg: '#F9D7DC', fg: '#842235' },
  uova: { label: 'Uova', bg: '#F3E5AE', fg: '#574500' },
  formaggi: { label: 'Formaggi', bg: '#E9DFD2', fg: '#54452F' },
  affettati: { label: 'Affettati', bg: '#E5DBF5', fg: '#4E3478' },
  mensa: { label: 'Mensa', none: true },
  libero: { label: 'A scelta', none: true }
};
const WEEK = [
  { k: 'L', name: 'Lunedì', p: { c: 'uova', cer: 'Pane' }, c: { c: 'legumi', cer: 'Riso' } },
  { k: 'M', name: 'Martedì', p: { c: 'mensa' }, c: { c: 'rossa', cer: 'Orzo' } },
  { k: 'Me', name: 'Mercoledì', p: { c: 'affettati', cer: 'Piadina' }, c: { c: 'legumi', cer: 'Pasta' } },
  { k: 'G', name: 'Giovedì', p: { c: 'legumi', cer: 'Farro' }, c: { c: 'bianca', cer: 'Pane' } },
  { k: 'V', name: 'Venerdì', p: { c: 'uova', cer: 'Patate' }, c: { c: 'pesce', cer: 'Pasta' } },
  { k: 'S', name: 'Sabato', p: { c: 'rossa', cer: 'Pasta' }, c: { c: 'libero' } },
  { k: 'D', name: 'Domenica', p: { c: 'formaggi', cer: 'Polenta' }, c: { c: 'pesce', cer: 'Patate' } }
];
const SRC = { d: 5, s: 'p' };
const DST = { d: 3, s: 'c' };
const ABBR = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
class Component extends DCLogic {
  renderVals() {
    const dropped = !!(this.state || {}).dropped;
    const week = WEEK.map((d) => ({ ...d, p: { ...d.p }, c: { ...d.c } }));
    if (dropped) {
      const a = week[SRC.d][SRC.s];
      week[SRC.d][SRC.s] = week[DST.d][DST.s];
      week[DST.d][DST.s] = a;
    }
    const drop = () => this.setState({ dropped: true });
    const tile = (d, i, slot, slotName) => {
      const m = d[slot];
      const c = CAT[m.c];
      const isSrc = !dropped && i === SRC.d && slot === SRC.s;
      const isDst = !dropped && i === DST.d && slot === DST.s;
      const justSwapped = dropped && ((i === SRC.d && slot === SRC.s) || (i === DST.d && slot === DST.s));
      let look = c.none
        ? 'background: #F8F9FF; color: #43474E; border: 1.5px dashed #8E929A;'
        : 'background: ' + c.bg + '; color: ' + c.fg + '; border: 1.5px solid ' + c.bg + ';';
      if (isSrc) look = 'background: transparent; border: 2px dashed #2F5B8A;';
      if (isDst) look += ' outline: 3px solid #2F5B8A; outline-offset: 2px; cursor: pointer;';
      if (justSwapped) look += ' outline: 2px solid #2F5B8A; outline-offset: 1px;';
      if (!isDst) look += ' cursor: default;';
      return {
        food: !isSrc && !c.none,
        none: !isSrc && !!c.none,
        floating: isDst,
        icon: IC[m.c],
        prot: c.label,
        cer: m.cer || '',
        drop: isDst ? drop : null,
        aria: d.name + ' ' + slotName + (isDst ? ': rilascia qui per scambiare' : ''),
        style: 'position: relative; min-height: 66px; box-sizing: border-box; padding: 7px 10px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; gap: 2px; text-align: left; min-width: 0; font: inherit; ' + look
      };
    };
    return {
      ic: IC,
      dropped,
      dragging: !dropped,
      undo: () => this.setState({ dropped: false }),
      barKicker: dropped ? 'Fatto' : 'Stai spostando',
      barTitle: dropped ? 'Pasti scambiati' : 'Sabato pranzo → giovedì cena',
      dragBg: CAT.rossa.bg,
      dragFg: CAT.rossa.fg,
      dragIcon: IC.rossa,
      days: week.map((d, i) => ({ k: ABBR[i], tiles: [tile(d, i, 'p', 'pranzo'), tile(d, i, 'c', 'cena')] }))
    };
  }
}
</script>
</body>
</html>
